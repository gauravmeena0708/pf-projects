<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Office 360° Profile · EPFO AGT Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand">
        <a href="index.html" style="text-decoration:none;color:inherit;display:flex;gap:12px;align-items:center">
          <div class="brand-badge">AGT</div>
          <div>
            <div class="brand-title">EPFO AGT 360°</div>
            <div class="brand-sub">Cadre & Mobility Suite</div>
          </div>
        </a>
      </div>

      <div class="nav-section">Analytics Modules</div>
      <nav class="nav">
        <a href="officer-profile.html" data-view="officer"><span class="icon">👤</span> Officer 360°</a>
        <a href="office-profile.html" data-view="office" class="active"><span class="icon">🏢</span> Office 360°</a>
        <a href="zone-profile.html" data-view="zone"><span class="icon">🌐</span> Zone 360°</a>
        <a href="as-on-date.html" data-view="as-on-date"><span class="icon">⏱️</span> As-on-date Snapshot</a>
        <a href="mobility.html" data-view="mobility"><span class="icon">🔄</span> Mobility Network</a>
      </nav>

      <div style="margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;color:#94a3b8">
        <div>EPFO Institutional Memory</div>
        <div style="color:#64748b;margin-top:4px">325+ offices · 21 Zones</div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <!-- Header -->
      <header class="topbar">
        <div class="crumb" id="topCrumb">AGT Analytics / <b>Office 360°</b></div>

        <!-- Universal Omnibox Search -->
        <div class="search-box-wrapper">
          <input type="text" id="globalSearchInput" class="search-input" placeholder="Search office (e.g. Amritsar, Jaipur, Head Office) or officer..." autocomplete="off">
          <div id="searchDropdown" class="search-dropdown"></div>
        </div>
      </header>

      <!-- Dynamic Content Injection Target -->
      <main class="content-body" id="mainContent">
        <div class="card" style="text-align:center;padding:48px 24px">
          <div style="font-size:14px;color:var(--muted);font-weight:600">Loading Office 360° profile...</div>
        </div>
      </main>
    </div>
  </div>

  <!-- Postings Raw Modal -->
  <div class="modal-backdrop" id="appModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle" style="margin:0;font-size:16px">Modal</h3>
        <button class="modal-close" onclick="window.App.closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalContent"></div>
    </div>
  </div>

  <!-- Leaflet Map JS & True Heatmap Plugin -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="app.js"></script>
</body>
</html>
